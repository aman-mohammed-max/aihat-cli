[package]
name = "aihat-cli"
version = "0.1.0"
edition = "2024"
description = "AI Hat terminal chat and command line client"
license = "MIT"

[[bin]]
name = "aihat"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
rpassword = "7.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy", "parsing"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
textwrap = "0.16"
unicode-segmentation = "1.13"
nucleo-matcher = "0.3"
supports-color = "3"
strsim = "0.11"
ctrlc = "3"
ignore = "0.4"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

