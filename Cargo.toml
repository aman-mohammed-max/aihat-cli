[package]
name = "aihat-cli"
version = "0.1.0"
edition = "2024"
description = "AI Hat terminal chat and command line client"
license = "MIT"

[[bin]]
name = "aihat"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
# rustls with the ring crypto library: builds with only a C compiler on every
# release target (Windows, macOS, Linux on all CPUs and musl, the BSDs).
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "rustls-no-provider", "charset", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rpassword = "7.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy", "parsing"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
textwrap = "0.16"
unicode-segmentation = "1.13"
nucleo-matcher = "0.3"
supports-color = "3"
strsim = "0.11"
ctrlc = "3"
ignore = "0.4"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control", "image-data"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
sha2 = "0.10"
flate2 = "1"
ruzstd = "0.8"
claxon = "0.4"
matrixmultiply = { version = "0.3", features = ["threading"] }
webbrowser = "1"


[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Smaller, faster-linking development builds (line numbers kept for backtraces).
[profile.dev]
debug = "line-tables-only"
